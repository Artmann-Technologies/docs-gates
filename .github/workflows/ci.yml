name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }

      - name: stack drift (stdlib-only root module)
        run: |
          bash scripts/stack-drift-check.sh

      - name: test
        run: go test ./...
