name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # No standalone gofmt step by design: the fleet golangci config
      # runs gofumpt (a strict superset of gofmt) on the lint step below,
      # so a separate gofmt pass only added latency (§2c assessment
      # 2026-11-05).

      # The fleet lint (same .golangci.yml the flake's devShell runs at 0
      # findings; v2.15.0 matches the flake pin). The //nolint:erraudit
      # directives make the runner WARN about an unknown linter — expected,
      # erraudit is a standalone binary, not a golangci plugin.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0

      - name: stack drift (stdlib-only root module)
        run: |
          bash scripts/stack-drift-check.sh

      - name: test
        run: go test ./...

      # The audit-all cliff tripwire: the memoized replay runs the
      # CV-shaped benchmark (1,600 reports × 2,000 living lines) at
      # ~50ms/op on CI-class hardware, so 100 iterations under an OS
      # `timeout` of 45s leave ~9x noise headroom while any regression
      # past ~10x (the pre-memo cost was ~2.75s/op) is killed with exit
      # 124. The harness's own -timeout never fires inside a benchmark
      # loop (probe-proven), so the ceiling must be the OS wrapper; the
      # sharper memo-loss contract is TestReplaySpeedGuard in the plain
      # test step above.
      - name: audit-all cliff benchmark
        run: timeout 45s go test ./internal/docsfreshness/ -run '^$' -bench BenchmarkCheckReportReplay -benchtime=100x

  # The nested module is invisible to the root module's ./... (by design,
  # stdlib-only root): without this job a provider regression ships
  # unnoticed. go-finding is public, so the proxy needs no credentials.
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/provider/go.mod

      - name: build
        working-directory: pkg/provider
        run: go build ./...

      - name: vet
        working-directory: pkg/provider
        run: go vet ./...

      # Same fleet config, discovered by walking up from pkg/provider —
      # the exact shape the repo's own lint command uses for the nested
      # module (the root ./... never sees it).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0
          working-directory: pkg/provider

      - name: test
        working-directory: pkg/provider
        run: go test ./...

  # The battery judges the repo that defines green: every push replays
  # all five gates over this repo's own living docs and status corpus
  # (the dogfood ritual sessions run by hand, mechanized). A red here is
  # real: when the cadence archive threshold trips on aging committed
  # reports, that is the ritual coming due on CI — archive the reports
  # or harvest the findings, never pin the gate.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: battery over this repo
        run: go run ./cmd/docs-gates run .
